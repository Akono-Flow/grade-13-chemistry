<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>States of Matter &amp; Cooling Curves — Mixed Assessment</title><style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#f3f6fb;color:#172033}.wrap{max-width:980px;margin:auto;padding:22px}.card{background:#fff;border:1px solid #dbe3ef;border-radius:16px;padding:22px;margin:14px 0;box-shadow:0 8px 28px #1720330d}h1,h2{margin-top:0}.muted{color:#64748b}.row{display:flex;gap:10px;flex-wrap:wrap}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}input,textarea,select,button{font:inherit;padding:10px;border:1px solid #cbd5e1;border-radius:9px}input,textarea,select{width:100%}button{cursor:pointer;font-weight:750}.primary{background:#174a7e;color:#fff;border-color:#174a7e}.hidden{display:none!important}.badge{display:inline-block;padding:5px 9px;border-radius:999px;background:#e7eef7;font-weight:700}.q{border-top:1px solid #e5e7eb;padding:18px 0}.q:first-child{border-top:0}.opts label{display:block;padding:9px;border:1px solid #e2e8f0;border-radius:9px;margin:7px 0}.qimg{max-width:100%;max-height:420px;display:block;margin:12px auto}.matchrow{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:8px 0}.labelwrap{position:relative;display:inline-block;max-width:100%}.labelwrap img{max-width:100%;display:block}.target{position:absolute;transform:translate(-50%,-50%);width:150px;max-width:25vw;padding:5px;font-size:12px}.topbar{position:sticky;top:0;background:#f3f6fbdd;backdrop-filter:blur(8px);padding:10px 0;z-index:20;display:flex;justify-content:space-between;gap:10px}.wm{position:fixed;inset:auto 18px 14px auto;opacity:.18;pointer-events:none;font-weight:800;transform:rotate(-12deg);z-index:99}.warn{background:#fff7ed;border-color:#fdba74}.ok{background:#ecfdf5;border-color:#86efac}@media(max-width:700px){.grid,.matchrow{grid-template-columns:1fr}.target{width:120px;font-size:11px}.wrap{padding:12px}}</style></head><body><div class="wrap"><div class="topbar"><span class="badge">Controlled Assessment</span><span id="timer" class="badge hidden"></span></div>
<section id="gate" class="card"><h1>States of Matter &amp; Cooling Curves — Mixed Assessment</h1><p id="gateMsg" class="muted">Connecting to Assessment Service…</p><div id="studentForm" class="hidden"><div class="grid"><div><label>Full name</label><input id="sname"></div><div><label>Student ID</label><input id="sid"></div><div><label>Class</label><input id="sclass"></div></div><div class="row" style="margin-top:14px"><button class="primary" id="startBtn">Begin Assessment</button></div></div></section>
<section id="assessment" class="hidden"><div class="card"><h1 id="atitle"></h1><div id="instructions"></div></div><div id="items" class="card"></div><div class="card"><button class="primary" id="submitBtn">Submit Assessment</button><p class="muted">Submission is final.</p></div></section>
<section id="done" class="card hidden"></section></div><div id="watermark" class="wm hidden"></div><iframe id="bridge" class="hidden"></iframe>
<script>
const C={"assessmentId":"assessment-states-matter-cooling-curve-2026-v1","title":"States of Matter & Cooling Curves — Mixed Assessment","serviceUrl":"https://script.google.com/macros/s/AKfycbyK8LtgDW0gU6sGlwYHmo6Oj2p-_qudTZP10m9ws2bEc6uZVmcIUYAdpG8hkZVO093Oxw/exec","requireFullscreen":true,"watermark":true,"maxViolations":3};let bridgeReady=false,bridgeSource=null,pending=[],attempt=null,A=null,violations=0,submitted=false,timerId=null;
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const token='b'+Math.random().toString(36).slice(2)+Date.now();
function serviceUrl(){if(!C.serviceUrl)throw Error('Assessment Service URL is not configured in this published assessment.');return C.serviceUrl+(C.serviceUrl.includes('?')?'&':'?')+'ocpbBridge=1&bridgeToken='+encodeURIComponent(token)}
function call(data){return new Promise((resolve,reject)=>{if(!bridgeSource){reject(Error('Assessment bridge has not connected.'));return}const entry={resolve,reject};pending.push(entry);bridgeSource.postMessage({type:'OCPB_ASSESSMENT_REQUEST',token,data},'*');setTimeout(()=>{const i=pending.indexOf(entry);if(i>=0){pending.splice(i,1);reject(Error('Assessment Service did not respond. Reload and try again.'))}},20000)})}
addEventListener('message',e=>{const m=e.data;if(!m||m.type!=='OCPB_ASSESSMENT_BRIDGE'||m.token!==token)return;if(m.stage==='ready'){if(bridgeReady)return;bridgeSource=e.source;bridgeReady=true;clearTimeout(connectTimer);registerPublishedUrl().catch(()=>{}).finally(checkAvailability)}else if(m.stage==='result'){const p=pending.shift();if(!p)return;m.data&&m.data.ok?p.resolve(m.data):p.reject(Error(m.data?.error||'Assessment Service request failed'))}});
async function registerPublishedUrl(){const publicUrl=location.origin+location.pathname;return call({action:'registerPublicUrl',courseId:C.courseId||'',assessmentId:C.assessmentId,publicUrl})}
async function checkAvailability(){try{const r=await call({action:'availability',assessmentId:C.assessmentId});$('gateMsg').textContent=r.message||r.status;if(r.status==='OPEN')$('studentForm').classList.remove('hidden')}catch(e){$('gateMsg').textContent=e.message}}
function renderItem(it,n){let h='<div class="q" data-item="'+esc(it.id)+'"><h3>'+n+'. '+esc(it.title||it.prompt||('Question '+n))+' <span class="muted">['+Number(it.marks||0)+' mark'+(Number(it.marks||0)===1?'':'s')+']</span></h3>';if(it.title&&it.prompt)h+='<p>'+esc(it.prompt)+'</p>';if(it.imageData)h+='<img class="qimg" src="'+esc(it.imageData)+'">';
 if(it.type==='mcq'){h+='<div class="opts">'+(it.options||[]).map(o=>'<label><input type="radio" name="q_'+esc(it.id)+'" value="'+esc(o.id)+'"> '+esc(o.text||'')+(o.imageData?'<img class="qimg" src="'+esc(o.imageData)+'">':'')+'</label>').join('')+'</div>'}
 else if(it.type==='manual'){h+='<textarea rows="'+(it.responseType==='short'?4:8)+'" data-manual="'+esc(it.id)+'" placeholder="Type your response here…"></textarea>'}
 else if(it.type==='match'){h+='<div>'+(it.cards||[]).map(c=>'<div class="matchrow"><div>'+esc(c.text||'')+(c.imageData?'<img class="qimg" src="'+esc(c.imageData)+'">':'')+'</div><select data-match="'+esc(it.id)+'" data-card="'+esc(c.id)+'"><option value="">Choose…</option>'+(it.bins||[]).map(b=>'<option value="'+esc(b.id)+'">'+esc(b.label||'Category')+'</option>').join('')+'</select></div>').join('')+'</div>'}
 else if(it.type==='sequence'){h+='<div>'+(it.steps||[]).map((st,i)=>'<div class="matchrow"><div>'+esc(st.caption||('Step '+(i+1)))+(st.imageData?'<img class="qimg" src="'+esc(st.imageData)+'">':'')+'</div><select data-seq="'+esc(it.id)+'" data-step="'+esc(st.id)+'"><option value="">Position…</option>'+(it.steps||[]).map((_,j)=>'<option value="'+(j+1)+'">'+(j+1)+'</option>').join('')+'</select></div>').join('')+'</div>'}
 else if(it.type==='label'){h+='<div class="labelwrap"><img src="'+esc(it.imageData||'')+'">'+(it.targets||[]).map(t=>'<select class="target" style="left:'+Number(t.x||0)+'%;top:'+Number(t.y||0)+'%" data-label="'+esc(it.id)+'" data-target="'+esc(t.id)+'"><option value="">Label…</option>'+(it.labels||[]).map(l=>'<option value="'+esc(l.id)+'">'+esc(l.text||'')+'</option>').join('')+'</select>').join('')+'</div>'}
 return h+'</div>'}
function renderAssessment(){const a=A.assessment;$('atitle').textContent=a.title||C.title;$('instructions').textContent=a.instructions||'';$('items').innerHTML=(a.items||[]).map((x,i)=>renderItem(x,i+1)).join('');$('gate').classList.add('hidden');$('assessment').classList.remove('hidden');if(C.watermark){$('watermark').textContent=(A.studentName||'')+' · '+(A.studentId||'');$('watermark').classList.remove('hidden')}if(a.timeLimit>0)startTimer(a.timeLimit*60);if(C.requireFullscreen)document.documentElement.requestFullscreen?.().catch(()=>{})}
$('startBtn').onclick=async()=>{try{const student={name:$('sname').value.trim(),studentId:$('sid').value.trim(),className:$('sclass').value.trim()};if(!student.name||!student.studentId||!student.className)throw Error('Enter your name, Student ID and class.');$('startBtn').disabled=true;const r=await call({action:'start',assessmentId:C.assessmentId,student});attempt=r.attemptToken;A={...r,studentName:student.name,studentId:student.studentId};renderAssessment()}catch(e){$('gateMsg').textContent=e.message;$('startBtn').disabled=false}};
function answers(){return (A.assessment.items||[]).map(it=>{let value='';if(it.type==='mcq')value=document.querySelector('input[name="q_'+CSS.escape(it.id)+'"]:checked')?.value||'';else if(it.type==='manual')value=document.querySelector('[data-manual="'+CSS.escape(it.id)+'"]')?.value||'';else if(it.type==='match'){value={};document.querySelectorAll('[data-match="'+CSS.escape(it.id)+'"]').forEach(x=>value[x.dataset.card]=x.value)}else if(it.type==='sequence'){value={};document.querySelectorAll('[data-seq="'+CSS.escape(it.id)+'"]').forEach(x=>value[x.dataset.step]=Number(x.value||0))}else if(it.type==='label'){value={};document.querySelectorAll('[data-label="'+CSS.escape(it.id)+'"]').forEach(x=>value[x.dataset.target]=x.value)}return{itemId:it.id,value}})}
async function submit(auto=false){if(submitted||!attempt)return;if(!auto&&!confirm('Submit this assessment now? You cannot change your answers afterward.'))return;submitted=true;$('submitBtn').disabled=true;try{const r=await call({action:'submit',attemptToken:attempt,answers:answers(),violations});clearInterval(timerId);$('assessment').classList.add('hidden');$('done').classList.remove('hidden');$('done').className='card ok';$('done').innerHTML='<h2>Assessment submitted</h2><p>Your responses were received successfully.</p><p class="muted">Marking status: '+esc(r.markingStatus||'Submitted')+'</p>'}catch(e){submitted=false;$('submitBtn').disabled=false;alert(e.message)}}
$('submitBtn').onclick=()=>submit(false);
function startTimer(sec){$('timer').classList.remove('hidden');let left=sec;const tick=()=>{const m=Math.floor(left/60),s=left%60;$('timer').textContent=m+':'+String(s).padStart(2,'0');if(left--<=0){clearInterval(timerId);submit(true)}};tick();timerId=setInterval(tick,1000)}
async function breach(type){if(!attempt||submitted)return;violations++;call({action:'event',attemptToken:attempt,type,count:violations}).catch(()=>{});if(violations>=C.maxViolations){alert('Assessment closed after repeated security-rule breaches. Your current responses will be submitted.');submit(true)}}
document.addEventListener('visibilitychange',()=>{if(document.hidden)breach('tab-hidden')});window.addEventListener('blur',()=>breach('window-blur'));document.addEventListener('fullscreenchange',()=>{if(attempt&&!document.fullscreenElement&&C.requireFullscreen)breach('fullscreen-exit')});document.addEventListener('contextmenu',e=>e.preventDefault());document.addEventListener('copy',e=>e.preventDefault());document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&['c','p','s','u'].includes(e.key.toLowerCase()))e.preventDefault()});
let connectTimer=setTimeout(()=>{if(!bridgeReady)$('gateMsg').textContent='Unable to connect to Assessment Service. Verify the deployed URL and refresh this page.'},15000);try{$('bridge').src=serviceUrl()}catch(e){clearTimeout(connectTimer);$('gateMsg').textContent=e.message}
</script></body></html>
