<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>New Mixed Assessment</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#f3f6fb;color:#172033;min-height:100vh;display:grid;place-items:center;padding:20px}.card{width:min(720px,100%);background:#fff;border:1px solid #dbe3ef;border-radius:18px;padding:26px}h1{margin-top:0}.muted{color:#64748b}.badge{display:inline-block;padding:5px 9px;border-radius:999px;background:#e8eef8;font-weight:700}button{border:0;border-radius:9px;padding:11px 15px;background:#173f73;color:#fff;font:inherit;font-weight:700}</style></head><body><main class="card"><span class="badge">Controlled Assessment</span><h1>New Mixed Assessment</h1><p>Protected questions and answer keys are not embedded in this public page.</p><p class="muted" id="status">Assessment ID: assessment-1fc6d773-3c17-4733-acd9-a85ed85a134b</p><button id="connect">Check Assessment Service</button></main><script>const C={"assessmentId":"assessment-1fc6d773-3c17-4733-acd9-a85ed85a134b","title":"New Mixed Assessment","serviceUrl":""};document.getElementById('connect').onclick=async()=>{const s=document.getElementById('status');if(!C.serviceUrl){s.textContent='No Assessment Service URL configured. Continue using the current Assessment Sync Package workflow.';return}try{const u=C.serviceUrl+(C.serviceUrl.includes('?')?'&':'?')+'action=publicPing&assessmentId='+encodeURIComponent(C.assessmentId);const r=await fetch(u);if(!r.ok)throw Error('Service returned '+r.status);s.textContent='Service reached. Direct protected question delivery is intentionally not enabled in this release.'}catch(e){s.textContent='Could not reach Assessment Service: '+e.message}};</script></body></html>
